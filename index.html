<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配信ポータル</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Serif+Display&display=swap');
  :root {
    --bg: #f7f5f1;
    --surface: #ffffff;
    --surface2: #f4f2ee;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.13);
    --text: #1a1a1e;
    --text2: #777;
    --accent: #c9a84c;
    --accent2: #a07830;
    --red: #d94f4f;
    --green: #2f9e5e;
    --blue: #2f73c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  #viewerPage { min-height: 100vh; display: flex; flex-direction: column; }

  /* ヘッダー */
  .header-strip { background: #fff; border-bottom: 1px solid var(--border); padding: 24px 40px 20px; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(217,79,79,0.08); border: 1px solid rgba(217,79,79,0.25); border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 700; color: var(--red); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
  .live-dot { width: 7px; height: 7px; background: var(--red); border-radius: 50%; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .stream-title { font-family: 'DM Serif Display', serif; font-size: 30px; color: #1a1410; line-height: 1.3; margin-bottom: 8px; }
  .period-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .period-label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
  .period-value { font-size: 14px; color: var(--text); font-weight: 500; }

  /* ステータスバナー */
  .status-banner { margin: 16px 40px 0; border-radius: 10px; padding: 12px 18px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .status-banner.waiting { background: rgba(47,115,192,0.07);  border: 1px solid rgba(47,115,192,0.2);  color: var(--blue); }
  .status-banner.live    { background: rgba(47,158,94,0.07);   border: 1px solid rgba(47,158,94,0.2);   color: var(--green); }
  .status-banner.ended   { background: rgba(0,0,0,0.04);       border: 1px solid rgba(0,0,0,0.1);       color: var(--text2); }

  /* 動画 */
  .video-area { flex: 1; padding: 20px 40px 12px; }
  .video-wrapper { position: relative; width: 100%; max-width: 960px; margin: 0 auto; padding-top: min(56.25%, 540px); background: #111; border-radius: 12px; overflow: hidden; border: 1px solid var(--border2); box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .video-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  .video-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #888; background: #fafaf9; }
  .big-icon { font-size: 56px; color: rgba(201,168,76,0.35); }

  /* ボトム */
  .bottom-area { padding: 16px 40px 28px; display: flex; flex-direction: column; gap: 12px; max-width: 960px; width: 100%; margin: 0 auto; }
  .update-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; background: #fff; border: 1.5px solid var(--accent); border-radius: 10px; color: var(--accent2); font-size: 15px; font-weight: 500; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: all 0.2s; }
  .update-btn:hover { background: #fffbf0; border-color: var(--accent2); }
  .update-btn:active { transform: scale(0.98); }
  .next-period { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .next-label { color: var(--text2); white-space: nowrap; }
  .next-value { color: var(--text); font-weight: 500; }
  .notice-box { background: #fff; border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 12px 16px; font-size: 13px; color: #555; line-height: 1.7; white-space: pre-wrap; }
  .admin-link { text-align: center; font-size: 12px; color: #bbb; cursor: pointer; padding: 6px; text-decoration: underline; text-underline-offset: 3px; }
  .admin-link:hover { color: var(--text2); }

  /* ログインモーダル */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border: 1px solid var(--border2); border-radius: 16px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
  .modal-title { font-size: 17px; font-weight: 700; color: #1a1410; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
  .field-group { margin-bottom: 16px; }
  .field-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; display: block; }
  .field-input { width: 100%; background: #f8f7f5; border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; font-family: 'Noto Sans JP', sans-serif; outline: none; transition: border-color 0.2s; }
  .field-input:focus { border-color: var(--accent); background: #fff; }
  .field-input::placeholder { color: #bbb; }
  .btn-primary { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 700; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: all 0.2s; }
  .btn-primary:hover { background: var(--accent2); }
  .error-msg { font-size: 12px; color: var(--red); margin-top: 6px; display: none; }
  .error-msg.show { display: block; }

  @media (max-width: 600px) {
    .header-strip, .video-area { padding-left: 20px; padding-right: 20px; }
    .status-banner { margin-left: 20px; margin-right: 20px; }
    .bottom-area { padding-left: 20px; padding-right: 20px; }
    .stream-title { font-size: 22px; }
    .modal { padding: 24px 20px; }
  }
</style>
</head>
<body>

<!-- 視聴者ログインモーダル -->
<div class="modal-overlay" id="loginOverlay">
  <div class="modal">
    <div class="modal-title"><i class="ti ti-lock"></i><span>視聴ページへ入室</span></div>
    <div id="nameFieldWrap" class="field-group" style="display:none">
      <label class="field-label">お名前</label>
      <input class="field-input" id="loginName" type="text" placeholder="名前を入力してください" />
    </div>
    <div id="passFieldWrap" class="field-group" style="display:none">
      <label class="field-label">パスワード</label>
      <input class="field-input" id="loginPass" type="password" placeholder="パスワードを入力してください" />
    </div>
    <div class="error-msg" id="loginError">パスワードが正しくありません</div>
    <div style="margin-top:20px">
      <button class="btn-primary" onclick="submitLogin()">入室する</button>
    </div>
  </div>
</div>

<!-- メイン視聴ページ -->
<div id="viewerPage" style="display:none">
  <div class="header-strip">
    <div class="live-badge"><div class="live-dot" id="liveDot"></div><span id="statusBadgeText">LIVE</span></div>
    <div class="stream-title" id="streamTitle">配信タイトル</div>
    <div class="period-row" id="periodRow">
      <span class="period-label">公開期間</span>
      <span class="period-value" id="periodDisplay">—</span>
    </div>
  </div>
  <div id="statusBanner" class="status-banner waiting">
    <i class="ti ti-clock"></i>
    <span id="statusText">配信開始まで少々お待ちください</span>
  </div>
  <div class="video-area">
    <div class="video-wrapper" id="videoWrapper">
      <div class="video-placeholder" id="videoPlaceholder">
        <i class="ti ti-player-play big-icon"></i>
        <span style="font-size:15px">配信が始まると動画が表示されます</span>
      </div>
    </div>
  </div>
  <div class="bottom-area">
    <button class="update-btn" onclick="refreshStream()">
      <i class="ti ti-refresh"></i>
      <span id="updateBtnText">更新（接続が悪ければこちらを押して下さい）</span>
    </button>
    <div class="next-period" id="nextPeriodBox" style="display:none">
      <i class="ti ti-calendar" style="color:var(--accent);font-size:18px"></i>
      <span class="next-label">次回配信</span>
      <span class="next-value" id="nextPeriodDisplay">—</span>
    </div>
    <div class="notice-box" id="noticeBox" style="display:none"></div>
    <div class="admin-link" onclick="window.open('admin.html','_blank')">管理者ページへ</div>
  </div>
</div>

<script>
// ★ RailwayにデプロイしたAPIのURLをここに設定してください ★
const API_BASE = 'https://shikuzahaishin-production.up.railway.app';

let viewerLoggedIn = false;
let cachedConfig = null;

async function apiFetch(path, body) {
  return fetch(API_BASE + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
}

function extractVideoId(url) {
  if (!url) return null;
  url = url.trim();
  let m;
  m = url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);  if (m) return m[1];
  m = url.match(/[?&]v=([A-Za-z0-9_-]{11})/);        if (m) return m[1];
  m = url.match(/\/live\/([A-Za-z0-9_-]{11})/);      if (m) return m[1];
  m = url.match(/\/embed\/([A-Za-z0-9_-]{11})/);     if (m) return m[1];
  if (/^[A-Za-z0-9_-]{11}$/.test(url)) return url;
  return null;
}

function fmtDT(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone:'Asia/Tokyo' });
}
function fmtRange(s, e) { return (!s && !e) ? '未設定' : fmtDT(s) + ' 〜 ' + fmtDT(e); }

function normalizeConfig(row) {
  return {
    title: row.title||'', ytUrl: row.yt_url||'',
    startTime: row.start_time||null, endTime: row.end_time||null,
    nextStart: row.next_start||null, nextEnd: row.next_end||null,
    passEnabled: !!row.pass_enabled, viewPass: row.view_pass||'',
    nameEnabled: !!row.name_enabled, notice: row.notice||'',
    isPublic: !!row.is_public,
    isLive: !!row.is_live,  // サーバーが計算した公開状態
  };
}

async function init() {
  try {
    const res = await apiFetch('/api/config');
    cachedConfig = normalizeConfig(await res.json());
  } catch(e) { cachedConfig = {}; }
  const needAuth = cachedConfig.passEnabled || cachedConfig.nameEnabled;
  if (!viewerLoggedIn && needAuth) { showLoginModal(cachedConfig); return; }
  showViewer(cachedConfig);
}

function showLoginModal(cfg) {
  document.getElementById('nameFieldWrap').style.display = cfg.nameEnabled ? 'block' : 'none';
  document.getElementById('passFieldWrap').style.display = cfg.passEnabled ? 'block' : 'none';
  document.getElementById('loginOverlay').classList.add('open');
}

async function submitLogin() {
  const err = document.getElementById('loginError');
  err.classList.remove('show');
  try {
    const res = await apiFetch('/api/auth', {
      password: document.getElementById('loginPass').value,
      name: document.getElementById('loginName').value,
    });
    const json = await res.json();
    if (!json.ok) { err.classList.add('show'); return; }
  } catch(e) { err.textContent = '通信エラーが発生しました'; err.classList.add('show'); return; }
  viewerLoggedIn = true;
  document.getElementById('loginOverlay').classList.remove('open');
  showViewer(cachedConfig);
}

function showViewer(cfg) {
  document.getElementById('viewerPage').style.display = 'flex';
  renderViewer(cfg);
}

function renderViewer(cfg) {
  cfg = cfg || {};
  const titleEl = document.getElementById('streamTitle');
  if (cfg.title && cfg.title.trim()) { titleEl.textContent = cfg.title; titleEl.style.display = ''; }
  else titleEl.style.display = 'none';

  const periodRow = document.getElementById('periodRow');
  if (cfg.startTime || cfg.endTime) { periodRow.style.display = 'flex'; document.getElementById('periodDisplay').textContent = fmtRange(cfg.startTime, cfg.endTime); }
  else periodRow.style.display = 'none';

  const nextBox = document.getElementById('nextPeriodBox');
  if (cfg.nextStart || cfg.nextEnd) { nextBox.style.display = 'flex'; document.getElementById('nextPeriodDisplay').textContent = fmtRange(cfg.nextStart, cfg.nextEnd); }
  else nextBox.style.display = 'none';

  const noticeBox = document.getElementById('noticeBox');
  if (cfg.notice && cfg.notice.trim()) { noticeBox.style.display = 'block'; noticeBox.textContent = cfg.notice; }
  else noticeBox.style.display = 'none';

  updateStreamStatus(cfg);
}

function updateStreamStatus(cfg) {
  cfg = cfg || {};
  const now   = new Date();
  const start = cfg.startTime ? new Date(cfg.startTime) : null;
  const end   = cfg.endTime   ? new Date(cfg.endTime)   : null;
  const banner = document.getElementById('statusBanner');
  const dot    = document.getElementById('liveDot');

  // サーバーが計算した isLive を優先、なければフロントで計算
  const isLive = cfg.isLive;
  let phase = 'none';
  if (cfg.isPublic) {
    phase = 'live';
  } else if (start && end) {
    if (now < start)  phase = 'waiting';
    else if (isLive)  phase = 'live';
    else              phase = 'ended';
  }

  if (phase === 'none') { banner.style.display = 'none'; }
  else {
    banner.style.display = 'flex';
    if (phase === 'waiting') {
      banner.className = 'status-banner waiting';
      document.getElementById('statusText').textContent = `配信開始まであと約 ${Math.round((start - now) / 60000)} 分`;
      document.getElementById('statusBadgeText').textContent = 'WAITING';
      dot.style.background = 'var(--blue)';
    } else if (phase === 'live') {
      banner.className = 'status-banner live';
      document.getElementById('statusText').textContent = '🔴 現在配信中です！';
      document.getElementById('statusBadgeText').textContent = 'LIVE';
      dot.style.background = 'var(--red)';
    } else {
      banner.className = 'status-banner ended';
      document.getElementById('statusText').textContent = '配信は終了しました';
      document.getElementById('statusBadgeText').textContent = 'ENDED';
      dot.style.background = 'var(--text2)';
    }
  }

  const videoId = extractVideoId(cfg.ytUrl);
  const wrapper = document.getElementById('videoWrapper');
  const placeholder = document.getElementById('videoPlaceholder');
  if (videoId && isLive) {
    const src = `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1`;
    let iframe = wrapper.querySelector('iframe');
    if (!iframe) { placeholder.style.display = 'none'; iframe = document.createElement('iframe'); iframe.allowFullscreen = true; iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture'; wrapper.appendChild(iframe); }
    if (iframe.src !== src) iframe.src = src;
  } else {
    const iframe = wrapper.querySelector('iframe');
    if (iframe) iframe.remove();
    placeholder.style.display = 'flex';
  }
}

async function refreshStream() {
  const btn = document.getElementById('updateBtnText');
  btn.textContent = '取得中...';
  try {
    cachedConfig = normalizeConfig(await (await apiFetch('/api/config')).json());
    renderViewer(cachedConfig);
    btn.textContent = '更新しました ✓';
  } catch(e) { btn.textContent = '通信エラー'; }
  setTimeout(() => { btn.textContent = '更新（接続が悪ければこちらを押して下さい）'; }, 2500);
}

setInterval(async () => {
  try { cachedConfig = normalizeConfig(await (await apiFetch('/api/config')).json()); updateStreamStatus(cachedConfig); } catch(e) {}
}, 30000);

window.addEventListener('load', init);
</script>
</body>
</html>
